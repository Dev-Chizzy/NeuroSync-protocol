name: NeuroSync Protocol CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-and-sdk:
    name: Backend API & Python SDK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Backend & SDK Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e sdk/

      - name: Verify API & Security Modules
        run: |
          python -c "from api.index import app; print('FastAPI App and Middleware Verified')"
          python -c "from api.security import RateLimiter, NonceReplayProtector, validate_stellar_address; print('Security Components Verified')"

      - name: Verify SDK & CLI Tool
        run: |
          neurosync --help
          python -c "from neurosync import NeuroSyncClient, SleepMetricSubmission; print('SDK Imports Verified')"

  smart-contracts:
    name: Soroban Smart Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Test NSync Token Contract
        run: |
          cargo test --manifest-path contracts/token/Cargo.toml

      - name: Check Reward Distributor Contract
        run: |
          cargo check --manifest-path contracts/reward_distributor/Cargo.toml

      - name: Check NeuroSync Core Contract
        run: |
          cargo check --manifest-path neurosync-core/Cargo.toml

  frontend:
    name: Frontend Application Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Next.js Application
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_API_URL: "https://neurosync-protocol.onrender.com"
        run: npm run build
